<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" preserveAspectRatio="xMidYMid slice" role="presentation">
  <!--
    オルタナ▽レンズ の背景アートワーク（v2）。

    v1 は全体が cyan だったので、UI（タイトルの光彩・▽ ボタン・アクセント）と
    同じ色味になって手前の要素が背景に溶けていた。v2 は 2 つ変えている。

      1. 支配色を cyan から「マゼンタ ←→ シアン」のデュオトーンに振る。
         UI が cyan なので、背景の主役は反対側のマゼンタが受け持つ
      2. 見せ場を左右の余白へ寄せ、中央（本文が乗る帯）は暗いままにする。
         中央を暗く落とすのは CSS 側の「中央通路」の役目だが、絵の側でも
         わざわざ中央に明るいものを置かない

    絵の明るさ自体はここで持たない。減光は CSS（.bf::before）でやる。
  -->
  <defs>
    <radialGradient id="base" cx="50%" cy="46%" r="86%">
      <stop offset="0%" stop-color="#05060e" />
      <stop offset="58%" stop-color="#0a0918" />
      <stop offset="100%" stop-color="#171033" />
    </radialGradient>

    <radialGradient id="glowMagenta">
      <stop offset="0%" stop-color="#ff2e88" stop-opacity=".95" />
      <stop offset="38%" stop-color="#e0219a" stop-opacity=".38" />
      <stop offset="100%" stop-color="#a21caf" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowCyan">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity=".8" />
      <stop offset="40%" stop-color="#0ea5e9" stop-opacity=".3" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowViolet">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity=".68" />
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowAmber">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity=".38" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- 地平線。中央だけ白熱させて左右へ流す -->
    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff2e88" stop-opacity="0" />
      <stop offset="22%" stop-color="#ff5fa2" stop-opacity=".55" />
      <stop offset="50%" stop-color="#ffe4f2" stop-opacity=".95" />
      <stop offset="78%" stop-color="#67e8f9" stop-opacity=".6" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0" />
    </linearGradient>

    <!-- 屈折した光の筋 -->
    <linearGradient id="streakCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a5f3fc" stop-opacity="0" />
      <stop offset="50%" stop-color="#a5f3fc" stop-opacity=".55" />
      <stop offset="100%" stop-color="#a5f3fc" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="streakMagenta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff8ac0" stop-opacity="0" />
      <stop offset="50%" stop-color="#ff8ac0" stop-opacity=".5" />
      <stop offset="100%" stop-color="#ff8ac0" stop-opacity="0" />
    </linearGradient>

    <!-- ▽ の透かしは左右で色を変えて、デュオトーンであることを示す -->
    <linearGradient id="markDuo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff2e88" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>

    <linearGradient id="gridFadeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" />
      <stop offset="38%" stop-color="#6a6a6a" />
      <stop offset="100%" stop-color="#e6e6e6" />
    </linearGradient>
    <mask id="gridFade">
      <rect x="0" y="614" width="1440" height="286" fill="url(#gridFadeGrad)" />
    </mask>

    <filter id="soft" x="-30%" y="-400%" width="160%" height="900%">
      <feGaussianBlur stdDeviation="14" />
    </filter>
  </defs>

  <rect width="1440" height="900" fill="url(#base)" />

  <!-- 光。見せ場は左右の余白（本文は中央に乗るので中央には置かない） -->
  <ellipse cx="1330" cy="150" rx="560" ry="470" fill="url(#glowCyan)" />
  <ellipse cx="95" cy="770" rx="600" ry="500" fill="url(#glowMagenta)" />
  <ellipse cx="1240" cy="880" rx="480" ry="360" fill="url(#glowViolet)" />
  <ellipse cx="30" cy="90" rx="360" ry="300" fill="url(#glowAmber)" />

  <!-- 主役のレンズ。右上の余白に据える -->
  <g fill="none" stroke="#a5f3fc">
    <circle cx="1285" cy="205" r="92" opacity=".5" stroke-width="1.5" />
    <circle cx="1285" cy="205" r="138" opacity=".36" stroke-width="1.25" />
    <circle cx="1285" cy="205" r="196" opacity=".26" stroke-width="1.25" />
    <circle cx="1285" cy="205" r="266" opacity=".17" stroke-width="1" />
    <circle cx="1285" cy="205" r="348" opacity=".11" stroke-width="1" />
    <circle cx="1285" cy="205" r="446" opacity=".07" stroke-width="1" />
  </g>
  <!-- 絞り羽根。レンズであることを一番わかりやすく示す形 -->
  <g fill="none" stroke="#e0f7ff" stroke-linejoin="round">
    <polygon points="1285,113 1365,159 1365,251 1285,297 1205,251 1205,159" opacity=".55" stroke-width="1.75" />
    <polygon points="1285,145 1341,177 1341,233 1285,265 1229,233 1229,177" opacity=".3" stroke-width="1.25" />
  </g>
  <circle cx="1285" cy="205" r="92" fill="#67e8f9" opacity=".08" />

  <!-- 対になる小さいレンズ。左下の余白に置いて画面を対角に振る -->
  <g fill="none" stroke="#ff9ecb">
    <circle cx="150" cy="700" r="62" opacity=".45" stroke-width="1.5" />
    <circle cx="150" cy="700" r="98" opacity=".3" stroke-width="1.25" />
    <circle cx="150" cy="700" r="146" opacity=".19" stroke-width="1" />
    <circle cx="150" cy="700" r="208" opacity=".11" stroke-width="1" />
  </g>
  <polygon points="150,638 204,669 204,731 150,762 96,731 96,669" fill="none" stroke="#ffd6ea" stroke-width="1.5" stroke-linejoin="round" opacity=".4" />

  <!-- ブランドの ▽。左右で色が変わる -->
  <polygon points="256,96 1184,96 720,712" fill="none" stroke="url(#markDuo)" stroke-width="2" opacity=".16" />

  <!-- 屈折。画面を斜めに横切る光 -->
  <g>
    <rect x="-200" y="238" width="1840" height="2.4" fill="url(#streakCyan)" opacity=".6" transform="rotate(-15 720 240)" />
    <rect x="-200" y="272" width="1840" height="1.1" fill="url(#streakCyan)" opacity=".3" transform="rotate(-15 720 240)" />
    <rect x="-200" y="596" width="1840" height="2" fill="url(#streakMagenta)" opacity=".55" transform="rotate(9 720 596)" />
  </g>

  <!-- 別次元へ続くグリッド。マゼンタで、UI の cyan とはっきり分ける -->
  <g mask="url(#gridFade)" fill="none" stroke="#ff5ba8" stroke-width="1.2" opacity="1">
    <path d="M720 614 L-560 900 M720 614 L-230 900 M720 614 L40 900 M720 614 L268 900 M720 614 L458 900 M720 614 L614 900 M720 614 L826 900 M720 614 L982 900 M720 614 L1172 900 M720 614 L1400 900 M720 614 L1670 900 M720 614 L2000 900" />
    <path d="M0 642h1440 M0 662h1440 M0 688h1440 M0 722h1440 M0 767h1440 M0 825h1440 M0 897h1440" />
  </g>

  <!-- 地平線。ここが一番明るい。グリッドの起点だと一目でわかる -->
  <rect x="0" y="607" width="1440" height="14" fill="url(#horizon)" opacity=".8" filter="url(#soft)" />
  <rect x="0" y="613" width="1440" height="1.6" fill="url(#horizon)" />

  <!-- 遠くの塵 -->
  <g fill="#ffd9ec">
    <circle cx="322" cy="196" r="1.7" opacity=".5" />
    <circle cx="1088" cy="132" r="1.4" opacity=".42" />
    <circle cx="248" cy="474" r="1.5" opacity=".38" />
    <circle cx="86" cy="318" r="1.4" opacity=".3" />
    <circle cx="392" cy="806" r="1.6" opacity=".34" />
  </g>
  <g fill="#a5f3fc">
    <circle cx="1216" cy="392" r="1.9" opacity=".38" />
    <circle cx="944" cy="98" r="1.3" opacity=".34" />
    <circle cx="1382" cy="486" r="1.5" opacity=".3" />
    <circle cx="1060" cy="330" r="1.2" opacity=".28" />
  </g>
</svg>
