<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" preserveAspectRatio="xMidYMid slice" role="presentation">
  <!--
    オルタナ▽レンズ の背景アートワーク。
    中央上に「レンズの虹彩（アイリス）」、下に別次元へ続くグリッド、
    ペルソナ 4 色（cyan / violet / amber / green）を光としてだけ散らしてある。

    画面に敷くときの減光・粒子・走査線は CSS 側（.bf::before）でやる。
    ここは「絵」だけを持ち、明るさの調整は持たない。
  -->
  <defs>
    <radialGradient id="base" cx="50%" cy="32%" r="82%">
      <stop offset="0%" stop-color="#16232f" />
      <stop offset="52%" stop-color="#0b1017" />
      <stop offset="100%" stop-color="#05070a" />
    </radialGradient>

    <radialGradient id="glowCyan">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity=".64" />
      <stop offset="42%" stop-color="#22d3ee" stop-opacity=".19" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowViolet">
      <stop offset="0%" stop-color="#a855f7" stop-opacity=".44" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowAmber">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity=".28" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowGreen">
      <stop offset="0%" stop-color="#22c55e" stop-opacity=".24" />
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0" />
    </radialGradient>

    <!-- 屈折した光の筋。両端を消して「差し込んでいる」ように見せる -->
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a5f3fc" stop-opacity="0" />
      <stop offset="50%" stop-color="#a5f3fc" stop-opacity=".5" />
      <stop offset="100%" stop-color="#a5f3fc" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="streakViolet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e9d5ff" stop-opacity="0" />
      <stop offset="50%" stop-color="#e9d5ff" stop-opacity=".28" />
      <stop offset="100%" stop-color="#e9d5ff" stop-opacity="0" />
    </linearGradient>

    <!-- グリッドは地平線側だけ濃く。上に行くほど消す -->
    <linearGradient id="gridFadeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" />
      <stop offset="45%" stop-color="#4a4a4a" />
      <stop offset="100%" stop-color="#c8c8c8" />
    </linearGradient>
    <mask id="gridFade">
      <rect x="0" y="596" width="1440" height="304" fill="url(#gridFadeGrad)" />
    </mask>
  </defs>

  <rect width="1440" height="900" fill="url(#base)" />

  <!-- 光の玉。ペルソナ 4 色を「光」としてだけ置く -->
  <ellipse cx="720" cy="270" rx="620" ry="470" fill="url(#glowCyan)" />
  <ellipse cx="150" cy="830" rx="520" ry="420" fill="url(#glowViolet)" />
  <ellipse cx="1350" cy="70" rx="420" ry="330" fill="url(#glowAmber)" />
  <ellipse cx="1320" cy="820" rx="380" ry="300" fill="url(#glowGreen)" />

  <!-- レンズの虹彩。同心円を外へ行くほど薄くする -->
  <g fill="none" stroke="#67e8f9" stroke-width="1.25">
    <circle cx="720" cy="300" r="132" opacity=".32" />
    <circle cx="720" cy="300" r="198" opacity=".24" />
    <circle cx="720" cy="300" r="272" opacity=".18" />
    <circle cx="720" cy="300" r="358" opacity=".13" />
    <circle cx="720" cy="300" r="455" opacity=".095" />
    <circle cx="720" cy="300" r="566" opacity=".068" />
    <circle cx="720" cy="300" r="694" opacity=".046" />
    <circle cx="720" cy="300" r="838" opacity=".03" />
  </g>

  <!-- 絞り羽根（六角形）。レンズであることを一番わかりやすく示す形 -->
  <g fill="none" stroke="#a5f3fc" stroke-linejoin="round">
    <polygon points="720,168 834,234 834,366 720,432 606,366 606,234" opacity=".3" stroke-width="1.5" />
    <polygon points="720,206 801,253 801,347 720,394 639,347 639,253" opacity=".19" stroke-width="1.25" />
  </g>

  <!-- ブランドの ▽ を透かしとして大きく置く -->
  <polygon points="318,116 1122,116 720,700" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity=".11" />

  <!-- 屈折。レンズを横切る光の筋 -->
  <g>
    <rect x="-160" y="286" width="1760" height="2.2" fill="url(#streak)" opacity=".55" transform="rotate(-13 720 300)" />
    <rect x="-160" y="316" width="1760" height="1.1" fill="url(#streak)" opacity=".3" transform="rotate(-13 720 300)" />
    <rect x="-160" y="540" width="1760" height="1.4" fill="url(#streakViolet)" opacity=".5" transform="rotate(7 720 540)" />
  </g>

  <!-- 別次元へ続くグリッド。消失点はレンズの真下 -->
  <g mask="url(#gridFade)" fill="none" stroke="#22d3ee" stroke-width="1" opacity=".66">
    <path d="M720 620 L-460 900 M720 620 L-160 900 M720 620 L110 900 M720 620 L330 900 M720 620 L505 900 M720 620 L640 900 M720 620 L800 900 M720 620 L935 900 M720 620 L1110 900 M720 620 L1330 900 M720 620 L1600 900 M720 620 L1900 900" />
    <path d="M0 646h1440 M0 664h1440 M0 688h1440 M0 719h1440 M0 760h1440 M0 812h1440 M0 878h1440" />
  </g>

  <!-- 遠くの塵。数を絞って、いるかいないか分からない程度に -->
  <g fill="#a5f3fc">
    <circle cx="322" cy="196" r="1.6" opacity=".5" />
    <circle cx="1088" cy="152" r="1.3" opacity=".4" />
    <circle cx="1216" cy="392" r="1.8" opacity=".3" />
    <circle cx="248" cy="474" r="1.4" opacity=".35" />
    <circle cx="944" cy="536" r="1.2" opacity=".3" />
    <circle cx="512" cy="118" r="1.2" opacity=".3" />
    <circle cx="1364" cy="266" r="1.5" opacity=".25" />
    <circle cx="86" cy="318" r="1.3" opacity=".28" />
  </g>
</svg>
